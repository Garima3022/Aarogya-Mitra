name: sehat_vision
description: "SEHAT VISION - AI-Assisted Early Screening for Everyone"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  provider: ^6.1.2
  camera: ^0.11.0+2
  path_provider: ^2.1.3
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0
  vibration: ^2.0.1
  connectivity_plus: ^6.0.3
  http: ^1.2.1
  shared_preferences: ^2.2.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/sample_data/
